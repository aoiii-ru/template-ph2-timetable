# POSSE大学 時間割アプリの開発環境
#   web : nginx（ブラウザからのリクエストを受ける） http://localhost:8080
#   app : PHP-FPM（Laravel を動かす）
#   db  : PostgreSQL（授業データを保存する）
services:
  web:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: posse
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      # データを残すための名前付きボリューム（PostgreSQL 18 からは /var/lib/postgresql に置く）
      - db-data:/var/lib/postgresql
      # 初回起動時（ボリュームが空のとき）だけ、このフォルダの .sql が順に実行される
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
